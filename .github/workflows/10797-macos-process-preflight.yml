name: 10797 macOS process preflight (fork only)

on:
  push:
    branches: [qa/10797-macos-process-preflight]

permissions:
  contents: read

jobs:
  process-preflight:
    if: github.repository == 'Dante-dan/pi'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Verify admitted runner and real process identity
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -a
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion)" = 27.0.1
          sleep 3 &
          child_pid=$!
          identity="$(/bin/ps -p "$child_pid" -o pid=,ppid=,pgid=,lstart=,command=)"
          printf '%s\n' "$identity"
          test "$(printf '%s\n' "$identity" | awk '{print $1}')" = "$child_pid"
          test "$(printf '%s\n' "$identity" | awk '{print $2}')" = "$$"
          wait "$child_pid"
          if /bin/ps -p "$child_pid" -o pid=; then
            echo 'Known completed child unexpectedly remains in process table'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - run: npm ci --ignore-scripts
      - name: Actual bash tool lifecycle regression and existing output regressions
        working-directory: packages/coding-agent
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/bash-detached-descendants-unix.test.ts
          test/suite/regressions/5208-late-bash-output.test.ts
          test/suite/regressions/5303-bash-output-truncation.test.ts
          --reporter=verbose
